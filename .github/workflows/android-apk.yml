name: STYLO Android Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: stylo-android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: 35

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Accept all Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK
        shell: bash
        run: sdkmanager "platforms;android-${ANDROID_PLATFORM}" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile and test
        run: gradle -p android :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Build release APK
        run: gradle -p android :app:assembleRelease --stacktrace

      - name: Build release AAB
        run: gradle -p android :app:bundleRelease --stacktrace

      - name: Verify release outputs
        shell: bash
        run: |
          set -e
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          file android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/release/app-release-unsigned.apk
          file android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stylo-eq-release-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
